<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaCare - Aquarium care tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1>AquaCare</h1>
      <p>Keep every tank on schedule.</p>
    </div>
    <svg class="wave" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 20 C150 40 300 0 450 20 S750 40 900 20 S1100 0 1200 20 V40 H0 Z"></path>
    </svg>
  </header>

  <main class="wrap">
    <div id="message" role="status" aria-live="polite" hidden></div>

    <section class="dashboard" aria-labelledby="dashboardHeading">
      <h2 id="dashboardHeading">Dashboard</h2>
      <div class="stats">
        <div class="stat stat-active">
          <span class="stat-num" id="statActive">0</span>
          <span class="stat-label">Active tasks</span>
        </div>
        <div class="stat stat-today">
          <span class="stat-num" id="statToday">0</span>
          <span class="stat-label">Due today</span>
        </div>
        <div class="stat stat-upcoming">
          <span class="stat-num" id="statUpcoming">0</span>
          <span class="stat-label">Upcoming</span>
        </div>
        <div class="stat stat-overdue">
          <span class="stat-num" id="statOverdue">0</span>
          <span class="stat-label">Overdue</span>
        </div>
      </div>
      <div class="recent">
        <h3>Recently completed</h3>
        <ul id="recentList" class="recent-list"></ul>
      </div>
    </section>

    <div class="columns">
      <section class="panel form-panel" aria-labelledby="formHeading">
        <h2 id="formHeading">Add a task</h2>
        <form id="taskForm" novalidate>
          <ul id="formErrors" class="form-errors" hidden></ul>

          <label for="title">Task title</label>
          <input type="text" id="title" maxlength="100" placeholder="e.g. Weekly water change" required>

          <label for="aquarium">Aquarium name</label>
          <input type="text" id="aquarium" maxlength="60" placeholder="e.g. 5G Betta Tank" required>

          <div class="row">
            <div>
              <label for="type">Task type</label>
              <select id="type" required>
                <option value="Feeding">Feeding</option>
                <option value="Water Change">Water Change</option>
                <option value="Water Testing">Water Testing</option>
                <option value="Filter Cleaning">Filter Cleaning</option>
                <option value="Plant Maintenance">Plant Maintenance</option>
                <option value="Medication">Medication</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <label for="frequency">Frequency</label>
              <select id="frequency">
                <option value="Once">Once</option>
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
                <option value="Monthly">Monthly</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <label for="dueDate">Due date</label>
          <input type="date" id="dueDate" required>

          <label for="notes">Notes (optional)</label>
          <textarea id="notes" rows="3" maxlength="500" placeholder="e.g. Replace about 20-30% of the water"></textarea>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Add task</button>
            <button type="button" class="btn btn-quiet" id="cancelEditBtn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="panel tasks-panel" aria-labelledby="tasksHeading">
        <h2 id="tasksHeading">Tasks</h2>
        <div class="filters" role="group" aria-label="Filter tasks by status">
          <button type="button" class="filter is-active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="overdue">Overdue</button>
          <button type="button" class="filter" data-filter="today">Due today</button>
          <button type="button" class="filter" data-filter="upcoming">Upcoming</button>
          <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>
        <p id="emptyState" class="empty" hidden></p>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </div>
  </main>

  <footer class="wrap site-footer">
    AquaCare is a CITE 006A final project. Task status is worked out from each due date.
  </footer>

  <script src="script.js"></script>
</body>
</html>
