<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <h1>AquaCare</h1>
        <span id="todayDate" class="today"></span>
        <button type="button" class="btn btn-light" id="newTaskBtn">New task</button>
      </div>
      <p id="lead" class="lead"></p>
    </div>
  </header>

  <main class="wrap">
    <h2 class="sr-only">Overview</h2>
    <nav class="strip" id="strip" aria-label="Show tasks by status">
      <button type="button" class="tab" data-filter="all"><span class="num" id="nAll">0</span><span class="lbl">All</span></button>
      <button type="button" class="tab" data-filter="overdue"><span class="num" id="nOverdue">0</span><span class="lbl">Overdue</span></button>
      <button type="button" class="tab" data-filter="today"><span class="num" id="nToday">0</span><span class="lbl">Due today</span></button>
      <button type="button" class="tab" data-filter="upcoming"><span class="num" id="nUpcoming">0</span><span class="lbl">Upcoming</span></button>
      <button type="button" class="tab" data-filter="completed"><span class="num" id="nCompleted">0</span><span class="lbl">Completed</span></button>
    </nav>

    <div class="layout">
      <section class="panel list-col" aria-label="Tasks">
        <div class="tools">
          <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
          <select id="filterAquarium" aria-label="Filter by aquarium"></select>
        </div>
        <p id="listSummary" class="list-sub"></p>
        <div id="taskArea"></div>
      </section>

      <aside class="side">
        <section class="panel">
          <h2>Aquariums</h2>
          <ul id="aquariumList" class="plain"></ul>
        </section>
        <section class="panel">
          <h2>Recently completed</h2>
          <ul id="recentList" class="plain"></ul>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="taskDialog" aria-labelledby="dialogTitle">
    <form id="taskForm" novalidate>
      <h2 id="dialogTitle">New task</h2>
      <ul id="formErrors" class="form-errors" hidden></ul>

      <fieldset class="types">
        <legend>What kind of task?</legend>
        <div class="type-grid" id="typeGrid"></div>
      </fieldset>

      <label for="title">Task</label>
      <input type="text" id="title" maxlength="100" placeholder="e.g. Weekly water change" autocomplete="off">

      <label for="aquarium">Aquarium</label>
      <select id="aquarium"></select>
      <div id="newAquariumRow" class="new-aquarium" hidden>
        <input type="text" id="newAquarium" maxlength="60" placeholder="Name of the new aquarium" aria-label="Name of the new aquarium" autocomplete="off">
        <button type="button" class="btn btn-primary" id="saveAquariumBtn">Save</button>
        <button type="button" class="btn btn-text" id="cancelAquariumBtn">Cancel</button>
      </div>

      <div class="pair">
        <div>
          <label for="dueDate">Due</label>
          <input type="date" id="dueDate">
        </div>
        <div>
          <label for="frequency">Repeats</label>
          <select id="frequency">
            <option>Once</option>
            <option>Daily</option>
            <option>Weekly</option>
            <option>Monthly</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <p class="hint" id="repeatHint" hidden>When you finish this task, the next one is added automatically.</p>

      <label for="notes">Notes</label>
      <textarea id="notes" rows="2" maxlength="500" placeholder="Optional"></textarea>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Add task</button>
        <button type="button" class="btn btn-text" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="script.js"></script>
</body>
</html>
